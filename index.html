<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect 4 Loop Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Hide scrollbars globally */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      :root {
        /* Raw Woodsy Dark Palette */
        --bg-color: #2b1d14;
        --panel-color: #3e2a1e;
        --border-color: #140d09;
        --text-color: #d6c5b3;

        --active-moss: #596b42;
        --path-amber: #a67c33;
        --hover-brown: #4d3326;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }

      .neo-panel {
        background-color: var(--panel-color);
        border: 4px solid var(--border-color);
        box-shadow: 8px 8px 0px var(--border-color);
        border-radius: 2px;
      }

      .neo-btn {
        background-color: var(--panel-color);
        color: var(--text-color);
        border: 3px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--border-color);
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        border-radius: 2px;
      }

      .neo-btn:hover:not(:disabled) {
        background-color: var(--hover-brown);
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px var(--border-color);
      }

      .neo-btn:active:not(:disabled) {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px var(--border-color);
      }

      .neo-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: 0px 0px 0px var(--border-color);
        transform: translate(4px, 4px);
      }

      .neo-btn.active {
        background-color: var(--active-moss);
        color: #fff;
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px var(--border-color);
      }

      .board-container {
        background-color: var(--hover-brown);
        border: 4px solid var(--border-color);
      }

      .board-cell {
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
        /* Hard, blunt inset shadow for physical feel, no glow */
        box-shadow: inset 4px 4px 0px rgba(0, 0, 0, 0.6);
        border-radius: 50%;
        transition: background-color 0.1s;
      }

      .cell-valid {
        background-color: var(--panel-color);
        border-color: var(--active-moss);
      }

      .cell-origin {
        background-color: var(--active-moss) !important;
        border-color: var(--border-color) !important;
        box-shadow: inset 4px 4px 0px rgba(0, 0, 0, 0.4);
      }

      .cell-path {
        background-color: var(--path-amber) !important;
        border-color: var(--border-color) !important;
        box-shadow: inset 4px 4px 0px rgba(0, 0, 0, 0.4);
      }

      /* A11y Contrast Rules for Coordinates */
      .board-cell .cell-coord {
        color: #f4eadd; /* High contrast bright cream for dark inset holes */
        transition: color 0.1s;
      }

      .cell-valid .cell-coord {
        color: #ffffff; /* Brightest white against the panel brown */
      }

      .cell-origin .cell-coord,
      .cell-path .cell-coord {
        color: var(
          --border-color
        ); /* Very dark brown/black against bright active colors */
      }

      .axis-label {
        font-size: 0.9rem;
        font-weight: bold;
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      details > summary {
        list-style: none;
        cursor: pointer;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }

      .code-box {
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-8">
      <header class="neo-panel p-4 md:p-6">
        <h1
          class="text-2xl font-bold uppercase border-b-4 border-[var(--border-color)] pb-2 inline-block"
        >
          Connect 4 Loops
        </h1>
        <p class="mt-2 text-sm">Visualizer for array boundary logic.</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 flex flex-col space-y-8">
          <div class="neo-panel p-4 md:p-6">
            <h2
              class="text-lg font-bold mb-4 border-b-2 border-[var(--border-color)] pb-2"
            >
              1. Select Pattern
            </h2>
            <div class="grid grid-cols-2 gap-3">
              <button
                class="neo-btn p-3 text-sm"
                id="btn-horizontal"
                onclick="selectPattern('horizontal')"
              >
                Horizontal [-]
              </button>
              <button
                class="neo-btn p-3 text-sm"
                id="btn-vertical"
                onclick="selectPattern('vertical')"
              >
                Vertical [|]
              </button>
              <button
                class="neo-btn p-3 text-sm"
                id="btn-posDiag"
                onclick="selectPattern('posDiag')"
              >
                Pos Diag [/]
              </button>
              <button
                class="neo-btn p-3 text-sm"
                id="btn-negDiag"
                onclick="selectPattern('negDiag')"
              >
                Neg Diag [\]
              </button>
            </div>
          </div>

          <div class="neo-panel flex-grow flex flex-col">
            <div class="p-4 border-b-4 border-[var(--border-color)]">
              <h2 class="text-lg font-bold">2. Run Execution</h2>
            </div>

            <div class="p-4 flex-grow flex flex-col gap-4">
              <button
                id="btn-run"
                class="neo-btn py-4 text-base bg-[var(--path-amber)] text-[var(--border-color)]"
                onclick="startAnimation()"
                disabled
              >
                [ RUN ANIMATION ]
              </button>

              <div
                id="output-log"
                class="text-sm code-box p-4 h-[200px] overflow-hidden"
              >
                Select a pattern to begin.
              </div>
            </div>
          </div>
        </div>

        <div
          class="lg:col-span-7 neo-panel p-6 flex flex-col items-center justify-center"
        >
          <div
            class="flex flex-col select-none relative w-full max-w-[500px] mx-auto"
          >
            <div class="flex pl-8 md:pl-10 mb-2">
              <div class="axis-label flex-1">c0</div>
              <div class="axis-label flex-1">c1</div>
              <div class="axis-label flex-1">c2</div>
              <div class="axis-label flex-1">c3</div>
              <div class="axis-label flex-1">c4</div>
              <div class="axis-label flex-1">c5</div>
              <div class="axis-label flex-1">c6</div>
            </div>

            <div class="flex">
              <div
                class="flex flex-col justify-around pr-2 md:pr-4 w-8 md:w-10"
              >
                <div class="axis-label">r0</div>
                <div class="axis-label">r1</div>
                <div class="axis-label">r2</div>
                <div class="axis-label">r3</div>
                <div class="axis-label">r4</div>
                <div class="axis-label">r5</div>
              </div>

              <div class="flex-1 board-container p-3">
                <div id="grid-container" class="grid grid-cols-7 gap-2">
                  <!-- Populated by JS -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <details class="neo-panel group cursor-pointer">
        <summary
          class="p-6 font-bold text-lg flex justify-between items-center border-b-[var(--border-color)] group-open:border-b-4"
        >
          <span>3. View Python Code (Procedural)</span>
          <span class="font-bold">v</span>
        </summary>
        <div class="p-6">
          <pre
            class="code-box p-4 overflow-x-auto"
          ><code id="code-block" class="text-sm"># Code will appear here</code></pre>
        </div>
      </details>
    </div>

    <script>
      const ROWS = 6;
      const COLS = 7;
      let pattern = null;
      let animId = 0;

      const pyCode = {
        horizontal: `# Check Horizontal
p = 1
for c in range(4):
    for r in range(6):
        if board[r][c] == p and \\
           board[r][c+1] == p and \\
           board[r][c+2] == p and \\
           board[r][c+3] == p:
            print("Win")`,

        vertical: `# Check Vertical
p = 1
for c in range(7):
    for r in range(3):
        if board[r][c] == p and \\
           board[r+1][c] == p and \\
           board[r+2][c] == p and \\
           board[r+3][c] == p:
            print("Win")`,

        posDiag: `# Check Positive Diagonal (/)
# r goes -1 (up), c goes +1 (right)
p = 1
for c in range(4):
    for r in range(3, 6):
        if board[r][c] == p and \\
           board[r-1][c+1] == p and \\
           board[r-2][c+2] == p and \\
           board[r-3][c+3] == p:
            print("Win")`,

        negDiag: `# Check Negative Diagonal (\\)
# r goes +1 (down), c goes +1 (right)
p = 1
for c in range(4):
    for r in range(3):
        if board[r][c] == p and \\
           board[r+1][c+1] == p and \\
           board[r+2][c+2] == p and \\
           board[r+3][c+3] == p:
            print("Win")`,
      };

      function buildGrid() {
        const grid = document.getElementById("grid-container");
        grid.innerHTML = "";
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const wrap = document.createElement("div");
            wrap.className = "aspect-square flex items-center justify-center";

            const cell = document.createElement("div");
            cell.id = `c-${r}-${c}`;
            cell.className = "w-full h-full board-cell relative";

            const debug = document.createElement("span");
            debug.className =
              "absolute inset-0 flex items-center justify-center text-[0.65rem] font-bold cell-coord select-none";
            debug.innerText = `${r},${c}`;

            cell.appendChild(debug);
            wrap.appendChild(cell);
            grid.appendChild(wrap);
          }
        }
      }

      function checkValid(r, c, p) {
        if (!p) return false;
        if (p === "horizontal") return c <= 3;
        if (p === "vertical") return r <= 2;
        if (p === "posDiag") return c <= 3 && r >= 3;
        if (p === "negDiag") return c <= 3 && r <= 2;
        return false;
      }

      function tracePath(r, c, p) {
        let arr = [{ r, c }];
        for (let i = 1; i < 4; i++) {
          if (p === "horizontal") arr.push({ r, c: c + i });
          if (p === "vertical") arr.push({ r: r + i, c });
          if (p === "posDiag") arr.push({ r: r - i, c: c + i });
          if (p === "negDiag") arr.push({ r: r + i, c: c + i });
        }
        return arr;
      }

      function clearBoard() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const el = document.getElementById(`c-${r}-${c}`);
            el.className = "w-full h-full board-cell relative";
            if (pattern && checkValid(r, c, pattern)) {
              el.classList.add("cell-valid");
            }
          }
        }
      }

      function selectPattern(p) {
        animId++;
        pattern = p;

        document
          .querySelectorAll(".neo-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(`btn-${p}`).classList.add("active");

        document.getElementById("code-block").innerText = pyCode[p];
        document.getElementById(
          "output-log"
        ).innerHTML = `Pattern: ${p}<br>Valid search space highlighted.<br>Press run.`;

        const btn = document.getElementById("btn-run");
        btn.disabled = false;
        btn.innerText = "[ RUN ANIMATION ]";

        clearBoard();
      }

      const wait = (ms) => new Promise((res) => setTimeout(res, ms));

      async function startAnimation() {
        if (!pattern) return;

        animId++;
        const currentId = animId;

        const btn = document.getElementById("btn-run");
        btn.disabled = true;
        btn.innerText = "EXECUTING...";

        const log = document.getElementById("output-log");

        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            if (currentId !== animId) return;

            if (checkValid(r, c, pattern)) {
              clearBoard();

              const path = tracePath(r, c, pattern);
              const originEl = document.getElementById(`c-${r}-${c}`);
              originEl.classList.add("cell-origin");

              log.innerHTML = `Valid Origin: r=${r}, c=${c}<br>Checking sequence...<br>`;

              for (let i = 0; i < 4; i++) {
                if (currentId !== animId) return;

                const pos = path[i];
                const stepEl = document.getElementById(`c-${pos.r}-${pos.c}`);

                if (i > 0 && stepEl) {
                  stepEl.classList.add("cell-path");
                }

                log.innerHTML += `-> [${pos.r}][${pos.c}]<br>`;
                await wait(200);
              }
              await wait(600);
            }
          }
        }

        if (currentId === animId) {
          log.innerHTML = "Animation complete.";
          btn.disabled = false;
          btn.innerText = "[ RESTART ]";
          clearBoard();
        }
      }

      window.onload = buildGrid;
    </script>
  </body>
</html>
